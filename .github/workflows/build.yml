name: Build APK

on:
  push:
    branches: [main]
    # 工作流会回写 update.json；忽略它，避免机器人提交再次触发构建形成死循环
    paths-ignore:
      - update.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史才能检查 tag 是否已存在
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build APK
        run: ./build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayReplacement-debug
          path: build/manual/AutoPlayReplacement-debug.apk

      - name: Resolve APK version
        id: version
        run: |
          set -eu
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APK="build/manual/AutoPlayReplacement-debug.apk"
          BADGING=$("$AAPT" dump badging "$APK")
          VERSION_NAME=$(printf '%s\n' "$BADGING" \
              | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" \
              | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
              echo "无法从 APK 读取版本信息" >&2
              exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "已解析版本：$VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Generate release notes
        id: notes
        env:
          # push 事件直接给出本次提交的完整信息（标题 + 正文）
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          NOTES="$RUNNER_TEMP/notes.txt"

          # Release 描述与应用内更新弹窗都以本次提交信息为准
          if [ -n "${COMMIT_MESSAGE:-}" ]; then
              printf '%s\n' "$COMMIT_MESSAGE" > "$NOTES.raw"
          else
              git log -1 --pretty=%B > "$NOTES.raw"
          fi

          # 去掉行尾空白与首尾空行，其余原样保留，保证与提交信息一致
          # 注意：awk 内不能把变量命名为 index（与内置函数冲突）
          sed -e 's/[[:space:]]*$//' "$NOTES.raw" \
              | awk 'NF { started = 1 } started { lines[++count] = $0; if (NF) last = count }
                     END { for (i = 1; i <= last; i++) print lines[i] }' \
              > "$NOTES"

          if [ ! -s "$NOTES" ]; then
              echo "维护与稳定性改进。" > "$NOTES"
          fi

          echo "本次更新说明："
          cat "$NOTES"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "tag $TAG 已存在，跳过创建"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "PlayAuto $VERSION"
          git push origin "$TAG"

          # 描述内容就是提交信息本身，应用内更新弹窗会原样展示
          gh release create "$TAG" \
              "build/manual/AutoPlayReplacement-debug.apk#AutoPlayReplacement-debug.apk" \
              --title "PlayAuto $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.txt"

      - name: Sync update.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -eu
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/AutoPlayReplacement-debug.apk"
          jq --arg version "$VERSION" \
             --argjson code "$VERSION_CODE" \
             --arg url "$URL" \
             --rawfile notes "$RUNNER_TEMP/notes.txt" \
             '.version = $version | .versionCode = $code | .url = $url | .notes = $notes' \
             update.json > update.json.tmp
          mv update.json.tmp update.json

          if git diff --quiet -- update.json; then
              echo "update.json 无变化，跳过提交"
              exit 0
          fi
          git add update.json
          git commit -m "chore: 更新版本信息到 $VERSION [skip ci]"
          git push