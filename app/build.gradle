plugins {
    id "com.android.application"
}

android {
    namespace "cn.autoplay.replacement"
    compileSdk 35

    defaultConfig {
        applicationId "cn.autoplay.replacement"
        minSdk 19
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
