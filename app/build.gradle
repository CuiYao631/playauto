plugins {
    id "com.android.application"
}

def buildStamp = new Date().format("yyyy.MM.dd_HHmmss", TimeZone.getTimeZone("Asia/Shanghai"))

android {
    namespace "cn.autoplay.replacement"
    compileSdk 35

    defaultConfig {
        applicationId "cn.autoplay.replacement"
        minSdk 19
        targetSdk 35
        versionCode 1
        versionName "${buildStamp}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
